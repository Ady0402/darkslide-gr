# The desktop shell (desktop/) on each platform it ships for: a selftest build is
# driven through its window, and the packaged app is installed and started.
#
# The same project is then generated on every platform and the results compared:
# RICOH's GR III 2.10 zip and FUJIFILM's LUT pack are downloaded from their own
# sites on the runner (desktop/ci/fetch_inputs.py; downloading RICOH's file accepts
# its licence) and never published. Uploaded: the comparison reports, and the
# installers (.dmg, Setup .exe) as run artifacts, which hold no firmware.
# Nothing is published; scripts/update_from_upstream.py brings in a new upstream
# release, and pushing it runs all of this again.
name: desktop

on:
  push:
    paths: ["desktop/**", "web/**", "darkslide/**", "launcher.py", ".github/workflows/desktop.yml"]
  workflow_dispatch:
  # From upstream-release.yml on the fork's default branch, once it has merged a new
  # upstream release: `ref` is the merge commit to test and package.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            dir: windows-amd64
            exe: Darkslide GR.exe
          - os: macos-latest
            platform: darwin/arm64
            dir: darwin-arm64
            exe: Darkslide GR.app/Contents/MacOS/Darkslide GR
          - os: macos-15-intel
            platform: darwin/amd64
            dir: darwin-amd64
            exe: Darkslide GR.app/Contents/MacOS/Darkslide GR
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      PYTHONUTF8: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4  # the CLI evaluates mygo.config.ts with Node 22.6+
        with:
          node-version: "22"
      - name: Licences match what is built in
        run: python scripts/licenses.py --check
      - name: Bundled Python
        run: python scripts/fetch_python.py --platform ${{ matrix.dir }}
      - name: Selftest build
        env:
          GOFLAGS: -tags=selftest
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-dmg -o build-selftest
      - name: Drive the window
        run: python scripts/selftest.py "build-selftest/${{ matrix.dir }}/${{ matrix.exe }}"
      - name: Firmware and LUTs (from RICOH and FUJIFILM, kept on the runner)
        run: python ci/fetch_inputs.py "$RUNNER_TEMP/inputs"
      - name: Generate the same project (4 Fuji LUTs renamed, sliders, icon, name, shutdown picture)
        run: python scripts/selftest.py "build-selftest/${{ matrix.dir }}/${{ matrix.exe }}" "@$RUNNER_TEMP/inputs/selftest-args.txt" --report "report-${{ matrix.dir }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.dir }}
          path: desktop/report-${{ matrix.dir }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Package
        env:
          DARKSLIDE_BUILD: ${{ github.run_number }}  # the build number; the version is darkslide's own
        run: go tool mygo build -platform ${{ matrix.platform }}
      - name: Everything the program reads is in the app
        run: |
          if [ "$RUNNER_OS" = Windows ]; then res="dist/${{ matrix.dir }}"; else res="dist/${{ matrix.dir }}/Darkslide GR.app/Contents/Resources"; fi
          python scripts/check_resources.py "$res"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.dir }}
          path: |
            desktop/dist/*/*.dmg
            desktop/dist/*/*Setup*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Install and start the installer's app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist/windows-amd64/*Setup*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Darkslide GR\Darkslide GR.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          python scripts/smoke.py "$exe"
          python scripts/smoke.py "$exe" --kill
      - name: Start the packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          python scripts/smoke.py "dist/${{ matrix.dir }}/${{ matrix.exe }}"
          python scripts/smoke.py "dist/${{ matrix.dir }}/${{ matrix.exe }}" --kill
      - name: Server log
        if: always()
        run: |
          for f in "$APPDATA/Darkslide GR/logs/server.log" "$HOME/Library/Logs/Darkslide GR/server.log"; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true

  # How long the read-only camera emulation behind every fit takes on each platform,
  # with the Python the app bundles. The server stops it at 60 s; this job lifts the
  # limit in its own process (darkslide/ is unchanged) to measure the real time.
  emulation-timing:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, dir: windows-amd64, python: resources/windows-amd64/python/python.exe }
          - { os: macos-latest, dir: darwin-arm64, python: resources/darwin-arm64/python/bin/python3 }
          - { os: macos-15-intel, dir: darwin-amd64, python: resources/darwin-amd64/python/bin/python3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4  # the CLI evaluates mygo.config.ts with Node 22.6+
        with:
          node-version: "22"
      - name: Bundled Python
        run: python scripts/fetch_python.py --platform ${{ matrix.dir }}
      - name: Firmware (from RICOH, kept on the runner)
        run: python ci/fetch_inputs.py "$RUNNER_TEMP/inputs"
      - name: Time the emulation
        run: |
          ${{ matrix.python }} -E -s -B ci/time_emulation.py "$RUNNER_TEMP/inputs/fwdc239b.bin" "timing-${{ matrix.dir }}.json"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "timing-${{ matrix.dir }}.json" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-${{ matrix.dir }}
          path: desktop/timing-${{ matrix.dir }}.json
          if-no-files-found: ignore
          retention-days: 14

  # The selftest's fits time out on x86 although one emulation takes 5–20 s there.
  # Same recipe, but 生成 only after 5 quiet minutes: passing here points at the work
  # the server starts after the imports, failing at the fits themselves.
  fit-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows/amd64, dir: windows-amd64, exe: Darkslide GR.exe }
          - { os: macos-15-intel, platform: darwin/amd64, dir: darwin-amd64, exe: Darkslide GR.app/Contents/MacOS/Darkslide GR }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      PYTHONUTF8: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4  # the CLI evaluates mygo.config.ts with Node 22.6+
        with:
          node-version: "22"
      - name: Licences match what is built in
        run: python scripts/licenses.py --check
      - name: Bundled Python
        run: python scripts/fetch_python.py --platform ${{ matrix.dir }}
      - name: Selftest build
        env:
          GOFLAGS: -tags=selftest
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-dmg -o build-selftest
      - name: Firmware and LUTs (from RICOH and FUJIFILM, kept on the runner)
        run: python ci/fetch_inputs.py "$RUNNER_TEMP/inputs"
      - name: Generate after 5 quiet minutes
        run: python scripts/selftest.py "build-selftest/${{ matrix.dir }}/${{ matrix.exe }}" "@$RUNNER_TEMP/inputs/selftest-args.txt" --settle 300 --report "probe-${{ matrix.dir }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.dir }}
          path: desktop/probe-${{ matrix.dir }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Server log
        if: always()
        run: |
          for f in "$APPDATA/Darkslide GR/logs/server.log" "$HOME/Library/Logs/Darkslide GR/server.log"; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true

  compare:
    needs: selftest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          merge-multiple: true
          path: reports
      - name: Compare the platforms
        run: |
          ls reports
          python3 desktop/scripts/compare_reports.py reports/*.json | tee -a "$GITHUB_STEP_SUMMARY"
