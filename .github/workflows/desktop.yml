# The desktop shell (desktop/) on each platform it ships for: a selftest build is
# driven through its window, and the packaged app is installed and started.
# No RICOH firmware is ever used here; the generate-and-download check runs only
# locally, with --firmware. This only reports ✅/❌; it never publishes or writes.
name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            dir: windows-amd64
            exe: Darkslide GR.exe
          - os: macos-latest
            platform: darwin/arm64
            dir: darwin-arm64
            exe: Darkslide GR.app/Contents/MacOS/Darkslide GR
          - os: macos-15-intel
            platform: darwin/amd64
            dir: darwin-amd64
            exe: Darkslide GR.app/Contents/MacOS/Darkslide GR
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      PYTHONUTF8: "1"
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bundled Python
        run: python scripts/fetch_python.py --platform ${{ matrix.dir }}
      - name: Selftest build
        env:
          GOFLAGS: -tags=selftest
        run: go tool mygo build -platform ${{ matrix.platform }} -skip-dmg -o build-selftest
      - name: Drive the window
        run: python scripts/selftest.py "build-selftest/${{ matrix.dir }}/${{ matrix.exe }}"
      - name: Package
        run: go tool mygo build -platform ${{ matrix.platform }}
      - name: Install and start the installer's app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist/windows-amd64/*Setup*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Darkslide GR\Darkslide GR.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          python scripts/smoke.py "$exe"
      - name: Start the packaged app (macOS)
        if: runner.os == 'macOS'
        run: python scripts/smoke.py "dist/${{ matrix.dir }}/${{ matrix.exe }}"
      - name: Server log
        if: always()
        run: |
          for f in "$APPDATA/Darkslide GR/logs/server.log" "$HOME/Library/Logs/Darkslide GR/server.log"; do
            [ -f "$f" ] && { echo "== $f"; cat "$f"; }
          done
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darkslide-desktop-${{ matrix.dir }}
          path: |
            desktop/dist/*/*.dmg
            desktop/dist/*/*Setup*.exe
          if-no-files-found: ignore
          retention-days: 7
